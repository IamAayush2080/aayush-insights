<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image to PDF — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🖼️</div>
    <h1 class="tool-page-title">Image to PDF</h1>
    <p class="tool-page-desc">Convert one or multiple images into a single PDF document instantly.</p>
  </div>
  <div class="tool-page-body">
    <div id="drop-zone" style="border:2px dashed var(--border2);border-radius:var(--r-lg);padding:48px;text-align:center;cursor:pointer;transition:var(--transition);margin-bottom:20px;">
      <div style="font-size:2.5rem;margin-bottom:12px;">📁</div>
      <p style="color:var(--text2);margin-bottom:8px;">Drop images here or click to upload</p>
      <p style="font-size:0.78rem;color:var(--text3);">PNG, JPG, WebP — multiple images supported</p>
      <input type="file" id="file-input" accept="image/*" multiple style="display:none;" />
    </div>

    <div id="preview-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:20px;"></div>

    <div id="controls" style="display:none;">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:0.78rem;color:var(--text3);font-family:var(--font-mono);">PAGE SIZE</label>
          <select class="tool-select" id="page-size">
            <option value="a4">A4</option>
            <option value="letter">Letter</option>
            <option value="a3">A3</option>
          </select>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:0.78rem;color:var(--text3);font-family:var(--font-mono);">ORIENTATION</label>
          <select class="tool-select" id="orientation">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-convert" style="padding:10px 28px;">Convert to PDF →</button>
        <button class="toolbar-btn" id="btn-reset">Reset</button>
      </div>
      <div id="status" style="margin-top:12px;"></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
let files = [];
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='var(--gold)'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor='var(--border2)');
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor='var(--border2)'; addFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => addFiles(fileInput.files));

function addFiles(newFiles) {
  files = [...files, ...Array.from(newFiles).filter(f => f.type.startsWith('image/'))];
  renderPreviews();
}

function renderPreviews() {
  const grid = document.getElementById('preview-grid');
  grid.innerHTML = files.map((f,i) => {
    const url = URL.createObjectURL(f);
    return `<div style="position:relative;text-align:center;">
      <img src="${url}" style="width:100%;height:100px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--border);" />
      <div style="font-size:0.7rem;color:var(--text3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${f.name}</div>
      <button onclick="removeFile(${i})" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.6);color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:0.7rem;cursor:pointer;">✕</button>
    </div>`;
  }).join('');
  document.getElementById('controls').style.display = files.length ? 'block' : 'none';
  dropZone.style.display = files.length ? 'none' : 'block';
}

function removeFile(i) { files.splice(i,1); renderPreviews(); }

document.getElementById('btn-convert').addEventListener('click', async () => {
  if (!files.length) return;
  const status = document.getElementById('status');
  status.innerHTML = '<span class="result-badge info">Converting...</span>';

  const { jsPDF } = window.jspdf;
  const pageSize = document.getElementById('page-size').value;
  const orient   = document.getElementById('orientation').value;
  const pdf = new jsPDF({ orientation: orient, unit: 'mm', format: pageSize });

  for (let i = 0; i < files.length; i++) {
    if (i > 0) pdf.addPage(pageSize, orient);
    const dataURL = await readAsDataURL(files[i]);
    const img = await loadImage(dataURL);
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const ratio = Math.min(pw / img.width, ph / img.height);
    const w = img.width * ratio, h = img.height * ratio;
    const x = (pw - w) / 2, y = (ph - h) / 2;
    pdf.addImage(dataURL, 'JPEG', x, y, w, h);
  }

  pdf.save('images.pdf');
  status.innerHTML = `<span class="result-badge success">✓ PDF created with ${files.length} page(s)</span>`;
});

function readAsDataURL(file) {
  return new Promise(res => { const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(file); });
}
function loadImage(src) {
  return new Promise(res => { const img=new Image(); img.onload=()=>res(img); img.src=src; });
}

document.getElementById('btn-reset').addEventListener('click', () => {
  files=[]; renderPreviews();
  document.getElementById('status').innerHTML='';
  fileInput.value='';
});
</script>
<script src="../assets/js/nav.js"></script>
</body>
</html>
