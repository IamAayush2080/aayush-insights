<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Diff Checker — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>

<div class="tool-page" style="max-width:1100px;">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🔍</div>
    <h1 class="tool-page-title">Text Diff Checker</h1>
    <p class="tool-page-desc">Compare two texts side by side and highlight every difference clearly.</p>
  </div>

  <div class="tool-page-body">
    <div class="tool-two-col">
      <div class="tool-input-wrap">
        <div class="tool-input-toolbar">
          <span class="toolbar-label mono">Original Text</span>
          <button class="toolbar-btn" onclick="document.getElementById('text-a').value=''">Clear</button>
        </div>
        <textarea id="text-a" class="tool-textarea" placeholder="Paste original text here..."></textarea>
      </div>
      <div class="tool-input-wrap">
        <div class="tool-input-toolbar">
          <span class="toolbar-label mono">Modified Text</span>
          <button class="toolbar-btn" onclick="document.getElementById('text-b').value=''">Clear</button>
        </div>
        <textarea id="text-b" class="tool-textarea" placeholder="Paste modified text here..."></textarea>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="btn-compare" style="padding:10px 28px;font-size:0.9rem;">Compare →</button>
      <button class="toolbar-btn" id="btn-reset">Reset</button>
    </div>

    <div id="diff-result" style="display:none;">
      <div style="display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;">
        <span class="result-badge success" id="badge-added"></span>
        <span class="result-badge warn" id="badge-removed"></span>
      </div>
      <div class="tool-section-card">
        <div class="tsc-header"><span class="mono" style="font-size:0.72rem;letter-spacing:0.15em;color:var(--text3);">DIFF RESULT</span></div>
        <div id="diff-output" style="font-size:0.9rem;line-height:1.9;white-space:pre-wrap;word-break:break-word;"></div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
function diffWords(a, b) {
  const wordsA = a.split(/(\s+)/);
  const wordsB = b.split(/(\s+)/);
  const dp = Array.from({length: wordsA.length+1}, () => new Array(wordsB.length+1).fill(0));
  for (let i=1;i<=wordsA.length;i++) for (let j=1;j<=wordsB.length;j++)
    dp[i][j] = wordsA[i-1]===wordsB[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);

  const result = []; let i=wordsA.length, j=wordsB.length;
  while (i>0||j>0) {
    if (i>0&&j>0&&wordsA[i-1]===wordsB[j-1]) { result.unshift({type:'same',val:wordsA[i-1]}); i--;j--; }
    else if (j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])) { result.unshift({type:'add',val:wordsB[j-1]}); j--; }
    else { result.unshift({type:'rem',val:wordsA[i-1]}); i--; }
  }
  return result;
}

document.getElementById('btn-compare').addEventListener('click', () => {
  const a = document.getElementById('text-a').value;
  const b = document.getElementById('text-b').value;
  if (!a.trim() && !b.trim()) return;

  const diff = diffWords(a, b);
  let added=0, removed=0, html='';
  diff.forEach(d => {
    if (d.type==='same') html += d.val;
    else if (d.type==='add') { added++; html += `<span class="diff-added">${d.val}</span>`; }
    else { removed++; html += `<span class="diff-removed">${d.val}</span>`; }
  });

  document.getElementById('diff-output').innerHTML = html;
  document.getElementById('badge-added').textContent = `+ ${added} added`;
  document.getElementById('badge-removed').textContent = `− ${removed} removed`;
  document.getElementById('diff-result').style.display = 'block';
});

document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('text-a').value = '';
  document.getElementById('text-b').value = '';
  document.getElementById('diff-result').style.display = 'none';
});
</script>
<script src="../assets/js/nav.js"></script>
</body>
</html>
