<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Encoder/Decoder — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🔗</div>
    <h1 class="tool-page-title">URL Encoder / Decoder</h1>
    <p class="tool-page-desc">Encode special characters in URLs or decode percent-encoded URLs.</p>
  </div>
  <div class="tool-page-body">
    <div class="tool-input-wrap">
      <div class="tool-input-toolbar">
        <span class="toolbar-label mono">Input</span>
        <button class="toolbar-btn" id="btn-paste">Paste</button>
        <button class="toolbar-btn" id="btn-clear">Clear</button>
      </div>
      <textarea id="main-input" class="tool-textarea" placeholder="Enter URL or text to encode/decode..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-encode" style="padding:10px 24px;">Encode →</button>
      <button class="btn-primary" id="btn-decode" style="padding:10px 24px;">← Decode</button>
      <button class="toolbar-btn" id="btn-copy">Copy</button>
    </div>
    <div id="status" style="margin-bottom:12px;"></div>
    <div class="tool-input-wrap">
      <div class="tool-input-toolbar"><span class="toolbar-label mono">Output</span></div>
      <textarea id="output" class="tool-textarea" readonly style="font-family:var(--font-mono);font-size:0.85rem;" placeholder="Result appears here..."></textarea>
    </div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
const inp=document.getElementById('main-input'),out=document.getElementById('output'),st=document.getElementById('status');
document.getElementById('btn-encode').addEventListener('click',()=>{
  try{out.value=encodeURIComponent(inp.value);st.innerHTML='<span class="result-badge success">✓ Encoded</span>';}
  catch(e){st.innerHTML='<span class="result-badge warn">✗ Error</span>';}
});
document.getElementById('btn-decode').addEventListener('click',()=>{
  try{out.value=decodeURIComponent(inp.value);st.innerHTML='<span class="result-badge success">✓ Decoded</span>';}
  catch(e){st.innerHTML='<span class="result-badge warn">✗ Invalid encoding</span>';}
});
document.getElementById('btn-paste').addEventListener('click',async()=>{inp.value=await navigator.clipboard.readText();});
document.getElementById('btn-clear').addEventListener('click',()=>{inp.value='';out.value='';st.innerHTML='';});
document.getElementById('btn-copy').addEventListener('click',()=>navigator.clipboard.writeText(out.value));
</script>
<script src="../assets/js/nav.js"></script>
</body>
</html>
