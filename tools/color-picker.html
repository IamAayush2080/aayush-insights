<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Picker — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🎨</div>
    <h1 class="tool-page-title">Color Picker</h1>
    <p class="tool-page-desc">Pick any color and instantly get HEX, RGB, HSL and CSS values.</p>
  </div>
  <div class="tool-page-body">
    <div style="display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;margin-bottom:24px;">
      <input type="color" id="color-input" value="#c9a84c" style="width:100px;height:100px;border:none;border-radius:var(--r-md);cursor:pointer;background:none;" />
      <div>
        <div id="preview-box" style="width:100%;height:60px;border-radius:var(--r-md);border:1px solid var(--border);margin-bottom:12px;background:#c9a84c;"></div>
        <div id="hex-display" style="font-family:var(--font-mono);font-size:1.3rem;color:var(--gold);">#c9a84c</div>
      </div>
    </div>

    <div id="values-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;"></div>

    <div class="tool-section-card">
      <div class="tsc-header"><span class="mono" style="font-size:0.72rem;letter-spacing:0.15em;color:var(--text3);">COLOR PALETTE</span></div>
      <div id="palette" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
    </div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>
function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b};}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
function lighten(hex,pct){const{r,g,b}=hexToRgb(hex);const f=1+pct/100;return '#'+[r,g,b].map(v=>Math.min(255,Math.round(v*f)).toString(16).padStart(2,'0')).join('');}
function darken(hex,pct){return lighten(hex,-pct);}

function update(hex) {
  const {r,g,b}=hexToRgb(hex);
  const {h,s,l}=rgbToHsl(r,g,b);
  document.getElementById('preview-box').style.background=hex;
  document.getElementById('hex-display').textContent=hex.toUpperCase();

  const vals=[
    {label:'HEX',value:hex.toUpperCase(),copy:hex.toUpperCase()},
    {label:'RGB',value:`rgb(${r}, ${g}, ${b})`,copy:`rgb(${r}, ${g}, ${b})`},
    {label:'HSL',value:`hsl(${h}, ${s}%, ${l}%)`,copy:`hsl(${h}, ${s}%, ${l}%)`},
    {label:'CSS var',value:`--color: ${hex.toUpperCase()}`,copy:`--color: ${hex.toUpperCase()}`},
  ];
  document.getElementById('values-grid').innerHTML=vals.map(v=>`
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;">
      <div style="font-size:0.7rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.15em;margin-bottom:6px;">${v.label}</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <code style="flex:1;font-family:var(--font-mono);font-size:0.85rem;color:var(--text);">${v.value}</code>
        <button class="toolbar-btn" onclick="navigator.clipboard.writeText('${v.copy}')">Copy</button>
      </div>
    </div>`).join('');

  // Palette: shades
  const shades=[-40,-20,0,20,40].map(p=>p===0?hex:(p<0?darken(hex,-p):lighten(hex,p)));
  document.getElementById('palette').innerHTML=shades.map(c=>`
    <div onclick="document.getElementById('color-input').value='${c}';update('${c}');" style="width:48px;height:48px;background:${c};border-radius:var(--r-sm);cursor:pointer;border:2px solid ${c===hex?'var(--text)':'transparent'};transition:transform 0.2s;" title="${c}"></div>`).join('');
}

document.getElementById('color-input').addEventListener('input',e=>update(e.target.value));
update('#c9a84c');
</script>
</body>
</html>
