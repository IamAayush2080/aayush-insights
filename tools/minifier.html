<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Minifier — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">⚡</div>
    <h1 class="tool-page-title">Code Minifier</h1>
    <p class="tool-page-desc">Minify HTML, CSS and JavaScript to reduce file size.</p>
  </div>
  <div class="tool-page-body">
    <div style="margin-bottom:16px;display:flex;gap:8px;align-items:center;">
      <span style="font-size:0.85rem;color:var(--text2);">Language:</span>
      <select class="tool-select" id="lang-select">
        <option value="css">CSS</option>
        <option value="js">JavaScript</option>
        <option value="html">HTML</option>
      </select>
    </div>
    <div class="tool-input-wrap">
      <div class="tool-input-toolbar">
        <span class="toolbar-label mono">Input Code</span>
        <button class="toolbar-btn" id="btn-paste">Paste</button>
        <button class="toolbar-btn" id="btn-clear">Clear</button>
      </div>
      <textarea id="main-input" class="tool-textarea" style="font-family:var(--font-mono);font-size:0.82rem;" placeholder="Paste your code here..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-minify" style="padding:10px 24px;">Minify →</button>
      <button class="toolbar-btn" id="btn-copy">Copy Output</button>
    </div>
    <div id="savings" style="margin-bottom:12px;"></div>
    <div class="tool-input-wrap">
      <div class="tool-input-toolbar"><span class="toolbar-label mono">Minified Output</span></div>
      <textarea id="output" class="tool-textarea" readonly style="font-family:var(--font-mono);font-size:0.82rem;" placeholder="Minified code appears here..."></textarea>
    </div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
function minifyCSS(css) {
  return css.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*([{}:;,>~+])\s*/g,'$1').replace(/;}/g,'}').trim();
}
function minifyJS(js) {
  return js.replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'').replace(/\n\s*\n/g,'\n').replace(/[ \t]+/g,' ').replace(/ ?([=+\-*/<>!&|,;:{}()\[\]]) ?/g,'$1').trim();
}
function minifyHTML(html) {
  return html.replace(/<!--[\s\S]*?-->/g,'').replace(/\s+/g,' ').replace(/> </g,'><').trim();
}

document.getElementById('btn-minify').addEventListener('click',()=>{
  const code=document.getElementById('main-input').value;
  const lang=document.getElementById('lang-select').value;
  if(!code.trim())return;
  let result='';
  if(lang==='css') result=minifyCSS(code);
  else if(lang==='js') result=minifyJS(code);
  else result=minifyHTML(code);
  document.getElementById('output').value=result;
  const saved=((1-result.length/code.length)*100).toFixed(1);
  document.getElementById('savings').innerHTML=`<span class="result-badge success">✓ Reduced by ${saved}% — ${code.length} → ${result.length} chars</span>`;
});
document.getElementById('btn-paste').addEventListener('click',async()=>{document.getElementById('main-input').value=await navigator.clipboard.readText();});
document.getElementById('btn-clear').addEventListener('click',()=>{document.getElementById('main-input').value='';document.getElementById('output').value='';document.getElementById('savings').innerHTML='';});
document.getElementById('btn-copy').addEventListener('click',()=>navigator.clipboard.writeText(document.getElementById('output').value));
</script>
<script src="../assets/js/nav.js"></script>
</body>
</html>
