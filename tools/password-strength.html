<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Checker — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🛡️</div>
    <h1 class="tool-page-title">Password Strength Checker</h1>
    <p class="tool-page-desc">Test how strong your password really is — with detailed feedback.</p>
  </div>
  <div class="tool-page-body">
    <div class="tool-input-wrap" style="margin-bottom:16px;">
      <div class="tool-input-toolbar">
        <span class="toolbar-label mono">Enter Password</span>
        <button class="toolbar-btn" id="btn-toggle">Show</button>
      </div>
      <input type="password" id="pw-input" class="tool-textarea" style="min-height:auto;padding:16px 20px;font-family:var(--font-mono);font-size:1rem;" placeholder="Type your password here..." />
    </div>

    <div class="strength-bar"><div class="strength-fill" id="str-fill" style="width:0%;"></div></div>
    <div style="display:flex;justify-content:space-between;margin:8px 0 20px;">
      <span id="str-label" style="font-size:0.85rem;color:var(--text2);">Enter a password to check</span>
      <span id="str-score" style="font-family:var(--font-mono);font-size:0.82rem;color:var(--text3);"></span>
    </div>

    <div id="checks" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:20px;"></div>
    <div id="tips" style="display:none;" class="tool-section-card">
      <div class="tsc-header"><span class="mono" style="font-size:0.72rem;letter-spacing:0.15em;color:var(--text3);">TIPS TO IMPROVE</span></div>
      <ul id="tips-list" style="list-style:none;display:flex;flex-direction:column;gap:8px;"></ul>
    </div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>
const rules = [
  {id:'len8',  label:'At least 8 characters',  test: p=>p.length>=8},
  {id:'len12', label:'At least 12 characters', test: p=>p.length>=12},
  {id:'upper', label:'Has uppercase letter',   test: p=>/[A-Z]/.test(p)},
  {id:'lower', label:'Has lowercase letter',   test: p=>/[a-z]/.test(p)},
  {id:'num',   label:'Has number',             test: p=>/[0-9]/.test(p)},
  {id:'sym',   label:'Has symbol',             test: p=>/[^A-Za-z0-9]/.test(p)},
  {id:'nocom', label:'Not a common password',  test: p=>!['password','123456','qwerty','abc123','letmein','monkey','welcome'].includes(p.toLowerCase())},
  {id:'norep', label:'No 3+ repeated chars',   test: p=>!/(.)\1\1/.test(p)},
];

document.getElementById('pw-input').addEventListener('input', function(){
  const p = this.value;
  if (!p) { document.getElementById('str-fill').style.width='0%'; document.getElementById('str-label').textContent='Enter a password to check'; document.getElementById('checks').innerHTML=''; document.getElementById('str-score').textContent=''; document.getElementById('tips').style.display='none'; return; }

  const passed = rules.filter(r=>r.test(p)).length;
  const pct = Math.round((passed/rules.length)*100);
  const levels=[{c:'#ef4444',l:'Very Weak'},{c:'#f97316',l:'Weak'},{c:'#eab308',l:'Fair'},{c:'#84cc16',l:'Strong'},{c:'#22c55e',l:'Very Strong'}];
  const idx=Math.min(4,Math.floor(passed/1.8));
  document.getElementById('str-fill').style.width=pct+'%';
  document.getElementById('str-fill').style.background=levels[idx].c;
  document.getElementById('str-label').textContent=levels[idx].l;
  document.getElementById('str-score').textContent=`${passed}/${rules.length} checks passed`;

  document.getElementById('checks').innerHTML=rules.map(r=>{
    const ok=r.test(p);
    return `<div style="display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid ${ok?'rgba(74,222,128,0.2)':'var(--border)'};border-radius:var(--r-sm);padding:10px 14px;">
      <span style="color:${ok?'#4ade80':'var(--text3)'};font-size:1rem;">${ok?'✓':'○'}</span>
      <span style="font-size:0.82rem;color:${ok?'var(--text)':'var(--text3)'};">${r.label}</span>
    </div>`;
  }).join('');

  const tips=rules.filter(r=>!r.test(p)).map(r=>`<li style="font-size:0.85rem;color:var(--text2);padding:4px 0;">→ ${r.label}</li>`);
  if(tips.length){document.getElementById('tips-list').innerHTML=tips.join('');document.getElementById('tips').style.display='block';}
  else document.getElementById('tips').style.display='none';
});

let shown=false;
document.getElementById('btn-toggle').addEventListener('click',function(){
  shown=!shown;
  document.getElementById('pw-input').type=shown?'text':'password';
  this.textContent=shown?'Hide':'Show';
});
</script>
</body>
</html>
