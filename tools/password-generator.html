<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🔑</div>
    <h1 class="tool-page-title">Password Generator</h1>
    <p class="tool-page-desc">Generate strong, random, secure passwords with custom rules.</p>
  </div>
  <div class="tool-page-body">
    <!-- Output -->
    <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-lg);padding:24px;margin-bottom:24px;text-align:center;">
      <div id="password-out" style="font-family:var(--font-mono);font-size:1.3rem;color:var(--gold);letter-spacing:0.08em;word-break:break-all;min-height:2em;display:flex;align-items:center;justify-content:center;">Click Generate</div>
      <div class="strength-bar" style="max-width:400px;margin:16px auto 0;"><div class="strength-fill" id="str-fill" style="width:0%;background:var(--gold);"></div></div>
      <div id="str-label" style="font-size:0.78rem;color:var(--text3);margin-top:6px;font-family:var(--font-mono);"></div>
    </div>

    <!-- Controls -->
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:20px;">
      <div style="margin-bottom:16px;">
        <label style="font-size:0.85rem;color:var(--text2);display:flex;justify-content:space-between;margin-bottom:8px;">
          Length <strong id="len-val" style="color:var(--gold);">16</strong>
        </label>
        <input type="range" id="length" min="6" max="64" value="16" />
      </div>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" id="inc-upper" checked> Uppercase (A-Z)</label>
        <label class="checkbox-item"><input type="checkbox" id="inc-lower" checked> Lowercase (a-z)</label>
        <label class="checkbox-item"><input type="checkbox" id="inc-nums" checked> Numbers (0-9)</label>
        <label class="checkbox-item"><input type="checkbox" id="inc-syms" checked> Symbols (!@#$...)</label>
        <label class="checkbox-item"><input type="checkbox" id="exc-ambig"> Exclude ambiguous (0,O,l,1)</label>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="btn-generate" style="padding:10px 28px;">Generate Password</button>
      <button class="toolbar-btn" id="btn-copy">Copy</button>
      <button class="toolbar-btn" id="btn-bulk">Generate 10</button>
    </div>

    <div id="bulk-list" style="margin-top:16px;"></div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
document.getElementById('length').addEventListener('input',function(){document.getElementById('len-val').textContent=this.value;});

function generate(){
  let chars='';
  if(document.getElementById('inc-upper').checked) chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('inc-lower').checked) chars+='abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('inc-nums').checked)  chars+='0123456789';
  if(document.getElementById('inc-syms').checked)  chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(document.getElementById('exc-ambig').checked) chars=chars.replace(/[0O1lI]/g,'');
  if(!chars) return 'Select at least one type';
  const len=parseInt(document.getElementById('length').value);
  const arr=new Uint32Array(len);
  crypto.getRandomValues(arr);
  return [...arr].map(v=>chars[v%chars.length]).join('');
}

function calcStrength(pw){
  let score=0;
  if(pw.length>=8)score++;if(pw.length>=12)score++;if(pw.length>=16)score++;
  if(/[A-Z]/.test(pw))score++;if(/[a-z]/.test(pw))score++;
  if(/[0-9]/.test(pw))score++;if(/[^A-Za-z0-9]/.test(pw))score++;
  return score;
}

function showPassword(pw){
  document.getElementById('password-out').textContent=pw;
  const s=calcStrength(pw);
  const pct=Math.round((s/7)*100);
  const colors=['#ef4444','#f97316','#eab308','#84cc16','#22c55e'];
  const labels=['Very Weak','Weak','Fair','Strong','Very Strong'];
  const idx=Math.min(4,Math.floor(s/1.5));
  document.getElementById('str-fill').style.width=pct+'%';
  document.getElementById('str-fill').style.background=colors[idx];
  document.getElementById('str-label').textContent=labels[idx];
}

document.getElementById('btn-generate').addEventListener('click',()=>showPassword(generate()));
document.getElementById('btn-copy').addEventListener('click',()=>navigator.clipboard.writeText(document.getElementById('password-out').textContent));
document.getElementById('btn-bulk').addEventListener('click',()=>{
  const list=document.getElementById('bulk-list');
  const pws=[...Array(10)].map(()=>generate());
  list.innerHTML=`<div class="tool-section-card"><div class="tsc-header"><span class="mono" style="font-size:0.72rem;letter-spacing:0.15em;color:var(--text3);">10 PASSWORDS</span></div>${pws.map(p=>`<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);"><code style="flex:1;font-family:var(--font-mono);font-size:0.82rem;color:var(--text2);">${p}</code><button class="toolbar-btn" onclick="navigator.clipboard.writeText('${p}')">Copy</button></div>`).join('')}</div>`;
});
showPassword(generate());
</script>
<script src="../assets/js/nav.js"></script>
</body>
</html>
