<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Converter — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>

<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🔡</div>
    <h1 class="tool-page-title">Case Converter</h1>
    <p class="tool-page-desc">Convert text between UPPERCASE, lowercase, Title Case, Sentence case, camelCase and more.</p>
  </div>

  <div class="tool-page-body">
    <div class="tool-input-wrap">
      <div class="tool-input-toolbar">
        <span class="toolbar-label mono">Input text</span>
        <button class="toolbar-btn" id="btn-paste">Paste</button>
        <button class="toolbar-btn" id="btn-clear">Clear</button>
      </div>
      <textarea id="main-input" class="tool-textarea" placeholder="Type or paste your text here..."></textarea>
    </div>

    <!-- Case buttons -->
    <div class="btn-row">
      <button class="toolbar-btn primary" data-case="upper">UPPERCASE</button>
      <button class="toolbar-btn primary" data-case="lower">lowercase</button>
      <button class="toolbar-btn primary" data-case="title">Title Case</button>
      <button class="toolbar-btn primary" data-case="sentence">Sentence case</button>
      <button class="toolbar-btn primary" data-case="camel">camelCase</button>
      <button class="toolbar-btn primary" data-case="snake">snake_case</button>
      <button class="toolbar-btn primary" data-case="kebab">kebab-case</button>
      <button class="toolbar-btn primary" data-case="alternate">aLtErNaTe</button>
    </div>

    <div class="tool-input-wrap">
      <div class="tool-input-toolbar">
        <span class="toolbar-label mono" id="output-label">Output</span>
        <button class="toolbar-btn" id="btn-copy">Copy</button>
        <button class="toolbar-btn" id="btn-swap">↕ Swap</button>
      </div>
      <div class="tool-output" id="output">Your converted text will appear here...</div>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
<script>
const input  = document.getElementById('main-input');
const output = document.getElementById('output');
const label  = document.getElementById('output-label');

const converters = {
  upper:    t => t.toUpperCase(),
  lower:    t => t.toLowerCase(),
  title:    t => t.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase()),
  sentence: t => t.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase()),
  camel:    t => t.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (_,c) => c.toUpperCase()),
  snake:    t => t.trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, ''),
  kebab:    t => t.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, ''),
  alternate:t => [...t].map((c,i) => i%2===0 ? c.toLowerCase() : c.toUpperCase()).join('')
};

document.querySelectorAll('[data-case]').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.case;
    output.textContent = converters[type](input.value || '');
    label.textContent = btn.textContent + ' Output';
  });
});

document.getElementById('btn-clear').addEventListener('click', () => { input.value = ''; output.textContent = 'Your converted text will appear here...'; });
document.getElementById('btn-paste').addEventListener('click', async () => { input.value = await navigator.clipboard.readText(); });
document.getElementById('btn-copy').addEventListener('click', () => navigator.clipboard.writeText(output.textContent));
document.getElementById('btn-swap').addEventListener('click', () => { input.value = output.textContent; output.textContent = 'Click a conversion button...'; });
</script>
</body>
</html>
