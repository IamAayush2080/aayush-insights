<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Compressor — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🗜️</div>
    <h1 class="tool-page-title">PDF Compressor</h1>
    <p class="tool-page-desc">Reduce PDF file size by removing metadata and optimizing structure.</p>
  </div>
  <div class="tool-page-body">
    <div id="drop-zone" style="border:2px dashed var(--border2);border-radius:var(--r-lg);padding:48px;text-align:center;cursor:pointer;transition:var(--transition);margin-bottom:20px;">
      <div style="font-size:2.5rem;margin-bottom:12px;">📄</div>
      <p style="color:var(--text2);margin-bottom:8px;">Drop a PDF here or click to upload</p>
      <input type="file" id="file-input" accept=".pdf" style="display:none;" />
    </div>
    <div id="controls" style="display:none;">
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;margin-bottom:20px;">
        <div style="font-size:0.72rem;color:var(--gold);font-family:var(--font-mono);letter-spacing:0.15em;margin-bottom:6px;">FILE INFO</div>
        <div id="file-info" style="font-size:0.9rem;color:var(--text2);"></div>
      </div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;margin-bottom:20px;">
        <div style="font-size:0.72rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.15em;margin-bottom:12px;">COMPRESSION OPTIONS</div>
        <div class="checkbox-group" style="flex-direction:column;">
          <label class="checkbox-item"><input type="checkbox" id="rm-meta" checked> Remove metadata (author, title, etc.)</label>
          <label class="checkbox-item"><input type="checkbox" id="rm-annot" checked> Remove annotations</label>
          <label class="checkbox-item"><input type="checkbox" id="rm-bookmarks"> Remove bookmarks</label>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-compress" style="padding:10px 28px;">Compress PDF →</button>
        <button class="toolbar-btn" id="btn-reset">Reset</button>
      </div>
      <div id="status" style="margin-top:12px;"></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../assets/js/main.js"></script>
<script>
let pdfBytes, origSize;
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='var(--gold)'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor='var(--border2)');
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor='var(--border2)'; loadFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));

async function loadFile(file) {
  if (!file || file.type !== 'application/pdf') return;
  origSize = file.size;
  pdfBytes = await file.arrayBuffer();
  document.getElementById('file-info').textContent = `${file.name} · ${(file.size/1024).toFixed(1)} KB`;
  document.getElementById('controls').style.display = 'block';
  dropZone.style.display = 'none';
}

document.getElementById('btn-compress').addEventListener('click', async () => {
  const st = document.getElementById('status');
  st.innerHTML = '<span class="result-badge info">⏳ Compressing...</span>';
  try {
    const doc = await PDFLib.PDFDocument.load(pdfBytes, { ignoreEncryption: true });
    if (document.getElementById('rm-meta').checked) {
      doc.setTitle(''); doc.setAuthor(''); doc.setSubject('');
      doc.setKeywords([]); doc.setProducer(''); doc.setCreator('');
    }
    if (document.getElementById('rm-annot').checked) {
      doc.getPages().forEach(page => {
        try { page.node.delete(PDFLib.PDFName.of('Annots')); } catch(e) {}
      });
    }
    if (document.getElementById('rm-bookmarks').checked) {
      try { doc.catalog.delete(PDFLib.PDFName.of('Outlines')); } catch(e) {}
    }
    const compressed = await doc.save({ useObjectStreams: true });
    const saved = (((origSize - compressed.byteLength) / origSize) * 100).toFixed(1);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([compressed], {type:'application/pdf'}));
    a.download = 'compressed.pdf'; a.click();
    st.innerHTML = `<span class="result-badge success">✓ Reduced by ~${saved}% — ${(origSize/1024).toFixed(1)} KB → ${(compressed.byteLength/1024).toFixed(1)} KB</span>`;
  } catch(e) { st.innerHTML = `<span class="result-badge warn">✗ Error: ${e.message}</span>`; }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('controls').style.display='none';
  dropZone.style.display='block'; fileInput.value='';
  document.getElementById('status').innerHTML='';
});
</script>
</body>
</html>
