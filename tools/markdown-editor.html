<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Editor — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
  <style>
    .md-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:500px;}
    .md-preview{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
    .md-preview-body{padding:20px;font-size:0.93rem;line-height:1.8;color:var(--text);}
    .md-preview-body h1,.md-preview-body h2,.md-preview-body h3{font-family:var(--font-disp);color:var(--text);margin:1.2em 0 0.4em;}
    .md-preview-body h1{font-size:1.8rem;} .md-preview-body h2{font-size:1.4rem;} .md-preview-body h3{font-size:1.1rem;}
    .md-preview-body p{margin:0.6em 0;}
    .md-preview-body code{font-family:var(--font-mono);font-size:0.82em;background:var(--bg3);padding:2px 6px;border-radius:4px;color:var(--gold);}
    .md-preview-body pre{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;overflow-x:auto;margin:1em 0;}
    .md-preview-body pre code{background:none;padding:0;color:var(--text);}
    .md-preview-body blockquote{border-left:3px solid var(--gold);padding-left:16px;color:var(--text2);font-style:italic;margin:1em 0;}
    .md-preview-body ul,.md-preview-body ol{padding-left:20px;margin:0.6em 0;}
    .md-preview-body li{margin:0.3em 0;}
    .md-preview-body a{color:var(--gold);text-decoration:underline;}
    .md-preview-body strong{font-weight:600;color:var(--text);}
    .md-preview-body em{font-style:italic;}
    .md-preview-body hr{border:none;border-top:1px solid var(--border);margin:1.5em 0;}
    .md-preview-body table{width:100%;border-collapse:collapse;margin:1em 0;}
    .md-preview-body th,.md-preview-body td{padding:8px 12px;border:1px solid var(--border);font-size:0.88rem;}
    .md-preview-body th{background:var(--bg3);font-weight:500;}
    @media(max-width:700px){.md-layout{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page" style="max-width:1100px;">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">📝</div>
    <h1 class="tool-page-title">Markdown Editor</h1>
    <p class="tool-page-desc">Write Markdown on the left, see the rendered preview on the right in real time.</p>
  </div>
  <div class="tool-page-body">
    <div class="btn-row" style="margin-bottom:12px;">
      <button class="toolbar-btn primary" id="btn-copy-md">Copy Markdown</button>
      <button class="toolbar-btn primary" id="btn-copy-html">Copy HTML</button>
      <button class="toolbar-btn" id="btn-clear">Clear</button>
      <button class="toolbar-btn" id="btn-sample">Load Sample</button>
      <button class="toolbar-btn" id="btn-download">Download .md</button>
    </div>
    <div class="md-layout">
      <div class="tool-input-wrap" style="margin-bottom:0;">
        <div class="tool-input-toolbar">
          <span class="toolbar-label mono">Markdown</span>
          <span id="word-count" style="font-size:0.72rem;color:var(--text3);font-family:var(--font-mono);">0 words</span>
        </div>
        <textarea id="md-input" class="tool-textarea" style="min-height:480px;font-family:var(--font-mono);font-size:0.85rem;line-height:1.7;" placeholder="# Start writing..."></textarea>
      </div>
      <div class="md-preview">
        <div class="tool-input-toolbar">
          <span class="toolbar-label mono">Preview</span>
        </div>
        <div class="md-preview-body" id="md-preview">Preview will appear here...</div>
      </div>
    </div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
function parseMarkdown(md) {
  let html = md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^#{6}\s(.+)$/gm,'<h6>$1</h6>')
    .replace(/^#{5}\s(.+)$/gm,'<h5>$1</h5>')
    .replace(/^#{4}\s(.+)$/gm,'<h4>$1</h4>')
    .replace(/^#{3}\s(.+)$/gm,'<h3>$1</h3>')
    .replace(/^#{2}\s(.+)$/gm,'<h2>$1</h2>')
    .replace(/^#{1}\s(.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/~~(.+?)~~/g,'<del>$1</del>')
    .replace(/^\s*>\s(.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^---$/gm,'<hr/>')
    .replace(/^\s*[-*+]\s(.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/^\d+\.\s(.+)$/gm,'<li>$1</li>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:var(--r-sm)"/>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br/>');
  return '<p>' + html + '</p>';
}

const input = document.getElementById('md-input');
const preview = document.getElementById('md-preview');

input.addEventListener('input', () => {
  const text = input.value;
  preview.innerHTML = text ? parseMarkdown(text) : '<span style="color:var(--text3);">Preview will appear here...</span>';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('word-count').textContent = words + ' words';
});

const SAMPLE = `# Hello, Markdown! 🌟

**Aayush Insights** — *tools, writings, and ideas.*

## What is Markdown?

Markdown is a lightweight markup language that you can use to add formatting to plaintext documents.

## Features

- **Bold text** and *italic text*
- \`inline code\` blocks
- Links like [Aayush Insights](https://iamayush2080.github.io/aayush-insights)

## Code Block

\`\`\`
function greet(name) {
  return "Hello, " + name + "! #7539";
}
\`\`\`

> The universe is under no obligation to make sense to you. — Neil deGrasse Tyson

---

That's Markdown! Simple and powerful.`;

document.getElementById('btn-sample').addEventListener('click', () => { input.value = SAMPLE; input.dispatchEvent(new Event('input')); });
document.getElementById('btn-clear').addEventListener('click', () => { input.value = ''; input.dispatchEvent(new Event('input')); });
document.getElementById('btn-copy-md').addEventListener('click', () => navigator.clipboard.writeText(input.value));
document.getElementById('btn-copy-html').addEventListener('click', () => navigator.clipboard.writeText(preview.innerHTML));
document.getElementById('btn-download').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([input.value], {type:'text/markdown'}));
  a.download = 'document.md'; a.click();
});
</script>
<script src="../assets/js/nav.js"></script>
</body>
</html>
