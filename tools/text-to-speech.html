<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text to Speech — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🔊</div>
    <h1 class="tool-page-title">Text to Speech</h1>
    <p class="tool-page-desc">Hear any text read aloud using your browser's built-in speech engine. Free, no API needed.</p>
  </div>
  <div class="tool-page-body">

    <div class="tool-input-wrap">
      <div class="tool-input-toolbar">
        <span class="toolbar-label mono">Enter Text</span>
        <button class="toolbar-btn" id="btn-paste">Paste</button>
        <button class="toolbar-btn" id="btn-clear">Clear</button>
        <span id="word-count" style="font-size:0.72rem;color:var(--text3);font-family:var(--font-mono);margin-left:auto;">0 words</span>
      </div>
      <textarea id="tts-input" class="tool-textarea" style="min-height:180px;" placeholder="Type or paste text to hear it spoken aloud..."></textarea>
    </div>

    <!-- Controls -->
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:20px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
        <div>
          <label style="font-size:0.75rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.1em;display:block;margin-bottom:8px;">VOICE</label>
          <select class="tool-select" id="voice-select" style="width:100%;"></select>
        </div>
        <div>
          <label style="font-size:0.75rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.1em;display:block;margin-bottom:8px;">LANGUAGE</label>
          <select class="tool-select" id="lang-select" style="width:100%;">
            <option value="">All languages</option>
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
          </select>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px;">
        <div>
          <label style="font-size:0.75rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.1em;display:flex;justify-content:space-between;margin-bottom:8px;">
            RATE <strong id="rate-val" style="color:var(--gold);">1x</strong>
          </label>
          <input type="range" id="rate-range" min="0.5" max="2" step="0.1" value="1" />
        </div>
        <div>
          <label style="font-size:0.75rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.1em;display:flex;justify-content:space-between;margin-bottom:8px;">
            PITCH <strong id="pitch-val" style="color:var(--gold);">1</strong>
          </label>
          <input type="range" id="pitch-range" min="0.5" max="2" step="0.1" value="1" />
        </div>
        <div>
          <label style="font-size:0.75rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.1em;display:flex;justify-content:space-between;margin-bottom:8px;">
            VOLUME <strong id="vol-val" style="color:var(--gold);">100%</strong>
          </label>
          <input type="range" id="vol-range" min="0" max="1" step="0.05" value="1" />
        </div>
      </div>

      <!-- Play controls -->
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <button class="btn-primary" id="btn-speak" style="padding:12px 36px;font-size:1rem;">▶ Speak</button>
        <button class="toolbar-btn" id="btn-pause" style="padding:12px 20px;" disabled>⏸ Pause</button>
        <button class="toolbar-btn" id="btn-stop" style="padding:12px 20px;" disabled>⏹ Stop</button>
        <div id="speaking-indicator" style="display:none;align-items:center;gap:8px;">
          <div style="display:flex;gap:3px;align-items:flex-end;height:20px;">
            <div style="width:3px;background:var(--gold);border-radius:2px;animation:bar 0.8s ease infinite;" class="bar1"></div>
            <div style="width:3px;background:var(--gold);border-radius:2px;animation:bar 0.8s ease infinite 0.1s;" class="bar2"></div>
            <div style="width:3px;background:var(--gold);border-radius:2px;animation:bar 0.8s ease infinite 0.2s;" class="bar3"></div>
            <div style="width:3px;background:var(--gold);border-radius:2px;animation:bar 0.8s ease infinite 0.3s;" class="bar4"></div>
          </div>
          <span style="font-size:0.82rem;color:var(--gold);font-family:var(--font-mono);">Speaking...</span>
        </div>
      </div>
    </div>

    <div id="no-support" style="display:none;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.2);border-radius:var(--r-md);padding:16px;">
      <p style="font-size:0.88rem;color:#f87171;">⚠ Your browser doesn't support Text to Speech. Try Chrome, Edge or Safari.</p>
    </div>
  </div>
</div>

<style>
@keyframes bar { 0%,100%{height:4px} 50%{height:18px} }
.bar1{animation-delay:0s!important} .bar2{animation-delay:0.15s!important} .bar3{animation-delay:0.3s!important} .bar4{animation-delay:0.45s!important}
</style>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
if (!('speechSynthesis' in window)) {
  document.getElementById('no-support').style.display = 'block';
}

let voices = [];
const synth = window.speechSynthesis;

function loadVoices() {
  voices = synth.getVoices();
  populateVoices();
}

function populateVoices() {
  const langFilter = document.getElementById('lang-select').value;
  const sel = document.getElementById('voice-select');
  const filtered = langFilter ? voices.filter(v => v.lang.startsWith(langFilter)) : voices;
  sel.innerHTML = filtered.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
}

if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
loadVoices();

document.getElementById('lang-select').addEventListener('change', populateVoices);
document.getElementById('rate-range').addEventListener('input', function() { document.getElementById('rate-val').textContent = this.value+'x'; });
document.getElementById('pitch-range').addEventListener('input', function() { document.getElementById('pitch-val').textContent = this.value; });
document.getElementById('vol-range').addEventListener('input', function() { document.getElementById('vol-val').textContent = Math.round(this.value*100)+'%'; });

document.getElementById('tts-input').addEventListener('input', function() {
  const w = this.value.trim() ? this.value.trim().split(/\s+/).length : 0;
  document.getElementById('word-count').textContent = w + ' words';
});

document.getElementById('btn-speak').addEventListener('click', () => {
  const text = document.getElementById('tts-input').value.trim();
  if (!text) return;
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voiceName = document.getElementById('voice-select').value;
  const voice = voices.find(v => v.name === voiceName);
  if (voice) utter.voice = voice;
  utter.rate   = parseFloat(document.getElementById('rate-range').value);
  utter.pitch  = parseFloat(document.getElementById('pitch-range').value);
  utter.volume = parseFloat(document.getElementById('vol-range').value);

  utter.onstart = () => {
    document.getElementById('speaking-indicator').style.display = 'flex';
    document.getElementById('btn-pause').disabled = false;
    document.getElementById('btn-stop').disabled  = false;
    document.getElementById('btn-speak').textContent = '▶ Speaking...';
  };
  utter.onend = utter.onerror = () => {
    document.getElementById('speaking-indicator').style.display = 'none';
    document.getElementById('btn-pause').disabled = true;
    document.getElementById('btn-stop').disabled  = true;
    document.getElementById('btn-speak').textContent = '▶ Speak';
    document.getElementById('btn-pause').textContent = '⏸ Pause';
  };
  synth.speak(utter);
});

let paused = false;
document.getElementById('btn-pause').addEventListener('click', function() {
  if (!paused) { synth.pause(); paused=true; this.textContent='▶ Resume'; }
  else { synth.resume(); paused=false; this.textContent='⏸ Pause'; }
});
document.getElementById('btn-stop').addEventListener('click', () => { synth.cancel(); paused=false; });
document.getElementById('btn-paste').addEventListener('click', async () => { document.getElementById('tts-input').value = await navigator.clipboard.readText(); document.getElementById('tts-input').dispatchEvent(new Event('input')); });
document.getElementById('btn-clear').addEventListener('click', () => { synth.cancel(); document.getElementById('tts-input').value=''; document.getElementById('word-count').textContent='0 words'; });
</script>
<script src="../assets/js/nav.js"></script>
</body>
</html>
