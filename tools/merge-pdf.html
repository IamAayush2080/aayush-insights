<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge PDF — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">📎</div>
    <h1 class="tool-page-title">Merge PDF</h1>
    <p class="tool-page-desc">Combine multiple PDF files into one. All processing happens in your browser.</p>
  </div>
  <div class="tool-page-body">
    <div id="drop-zone" style="border:2px dashed var(--border2);border-radius:var(--r-lg);padding:48px;text-align:center;cursor:pointer;transition:var(--transition);margin-bottom:20px;">
      <div style="font-size:2.5rem;margin-bottom:12px;">📄</div>
      <p style="color:var(--text2);margin-bottom:8px;">Drop PDF files here or click to upload</p>
      <p style="font-size:0.78rem;color:var(--text3);">Add 2 or more PDF files to merge</p>
      <input type="file" id="file-input" accept=".pdf" multiple style="display:none;" />
    </div>

    <div id="file-list" style="margin-bottom:16px;display:flex;flex-direction:column;gap:8px;"></div>

    <div id="controls" style="display:none;">
      <div class="btn-row">
        <button class="btn-primary" id="btn-merge" style="padding:10px 28px;">Merge PDFs →</button>
        <button class="toolbar-btn" id="btn-add-more">+ Add More</button>
        <button class="toolbar-btn" id="btn-reset">Reset</button>
      </div>
      <div id="status" style="margin-top:12px;"></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../assets/js/main.js"></script>
<script>
let files=[];
const dropZone=document.getElementById('drop-zone'),fileInput=document.getElementById('file-input');

dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.style.borderColor='var(--gold)';});
dropZone.addEventListener('dragleave',()=>dropZone.style.borderColor='var(--border2)');
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.style.borderColor='var(--border2)';addFiles(e.dataTransfer.files);});
fileInput.addEventListener('change',()=>addFiles(fileInput.files));
document.getElementById('btn-add-more')?.addEventListener('click',()=>fileInput.click());

function addFiles(newFiles) {
  files=[...files,...Array.from(newFiles).filter(f=>f.type==='application/pdf')];
  renderList();
}

function renderList() {
  const list=document.getElementById('file-list');
  list.innerHTML=files.map((f,i)=>`
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px;display:flex;align-items:center;gap:12px;">
      <span style="font-size:1.2rem;">📄</span>
      <span style="flex:1;font-size:0.88rem;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${f.name}</span>
      <span style="font-size:0.75rem;color:var(--text3);">${(f.size/1024).toFixed(1)} KB</span>
      <button onclick="removeFile(${i})" style="color:var(--text3);font-size:0.8rem;padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:none;cursor:pointer;">✕</button>
    </div>`).join('');
  document.getElementById('controls').style.display=files.length>=2?'block':'none';
  dropZone.style.display=files.length?'none':'block';
}

function removeFile(i){files.splice(i,1);renderList();}

document.getElementById('btn-merge').addEventListener('click',async()=>{
  const st=document.getElementById('status');
  st.innerHTML='<span class="result-badge info">⏳ Merging PDFs...</span>';
  try {
    const merged=await PDFLib.PDFDocument.create();
    for(const file of files){
      const buf=await file.arrayBuffer();
      const doc=await PDFLib.PDFDocument.load(buf);
      const pages=await merged.copyPages(doc,doc.getPageIndices());
      pages.forEach(p=>merged.addPage(p));
    }
    const bytes=await merged.save();
    const blob=new Blob([bytes],{type:'application/pdf'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='merged.pdf';
    a.click();
    st.innerHTML=`<span class="result-badge success">✓ Merged ${files.length} PDFs successfully</span>`;
  } catch(e){st.innerHTML=`<span class="result-badge warn">✗ Error: ${e.message}</span>`;}
});

document.getElementById('btn-reset').addEventListener('click',()=>{files=[];renderList();document.getElementById('status').innerHTML='';fileInput.value='';});
</script>
</body>
</html>
