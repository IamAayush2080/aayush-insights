<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">💱</div>
    <h1 class="tool-page-title">Currency Converter</h1>
    <p class="tool-page-desc">Live exchange rates between 160+ world currencies.</p>
  </div>
  <div class="tool-page-body">
    <div id="rate-status" style="margin-bottom:16px;"></div>

    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;margin-bottom:20px;">
      <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-bottom:20px;">
        <div>
          <label style="font-size:0.72rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.15em;display:block;margin-bottom:6px;">FROM</label>
          <select class="tool-select" id="from-cur" style="width:100%;"></select>
          <input type="number" id="amount" class="tool-input" style="width:100%;margin-top:10px;font-size:1.1rem;" value="1" min="0" />
        </div>
        <button id="btn-swap" style="background:var(--bg3);border:1px solid var(--border2);border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer;margin-top:20px;transition:var(--transition);" title="Swap">⇄</button>
        <div>
          <label style="font-size:0.72rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.15em;display:block;margin-bottom:6px;">TO</label>
          <select class="tool-select" id="to-cur" style="width:100%;"></select>
          <div id="result-val" style="font-family:var(--font-disp);font-size:1.8rem;font-weight:700;color:var(--gold);margin-top:10px;min-height:2.5rem;">—</div>
        </div>
      </div>
      <button class="btn-primary" id="btn-convert" style="padding:10px 28px;">Convert →</button>
      <div id="rate-info" style="margin-top:12px;font-size:0.82rem;color:var(--text3);"></div>
    </div>

    <!-- Popular pairs -->
    <div class="tool-section-card">
      <div class="tsc-header"><span class="mono" style="font-size:0.72rem;letter-spacing:0.15em;color:var(--text3);">POPULAR PAIRS (vs USD)</span></div>
      <div id="popular-rates" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;"></div>
    </div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
const CURRENCIES = ['USD','EUR','GBP','JPY','CNY','INR','NPR','AUD','CAD','CHF','SGD','AED','SAR','KRW','MXN','BRL','ZAR','HKD','SEK','NOK','DKK','NZD','THB','MYR','IDR','PHP','PKR','BDT','EGP','TRY','RUB','PLN','CZK','HUF','RON','BGN','HRK','ISK','ILS','CLP','COP','PEN','VND','UAH'];
const POPULAR = ['EUR','GBP','JPY','INR','NPR','CNY','AUD','CAD'];

let rates = {};

function populateSelects() {
  const opts = CURRENCIES.map(c=>`<option value="${c}">${c}</option>`).join('');
  document.getElementById('from-cur').innerHTML = opts;
  document.getElementById('to-cur').innerHTML = opts;
  document.getElementById('from-cur').value = 'USD';
  document.getElementById('to-cur').value = 'NPR';
}

async function fetchRates() {
  document.getElementById('rate-status').innerHTML='<span class="result-badge info">⏳ Fetching live rates...</span>';
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await res.json();
    rates = data.rates;
    document.getElementById('rate-status').innerHTML=`<span class="result-badge success">✓ Live rates loaded — Updated: ${new Date(data.time_last_update_utc).toLocaleDateString()}</span>`;
    showPopular();
  } catch(e) {
    document.getElementById('rate-status').innerHTML='<span class="result-badge warn">⚠ Could not fetch live rates. Using approximate rates.</span>';
    rates = {USD:1,EUR:0.92,GBP:0.79,JPY:149.5,CNY:7.24,INR:83.1,NPR:133,AUD:1.53,CAD:1.36,CHF:0.9,SGD:1.34};
  }
}

function convert() {
  const from=document.getElementById('from-cur').value;
  const to=document.getElementById('to-cur').value;
  const amount=parseFloat(document.getElementById('amount').value)||0;
  if(!rates[from]||!rates[to]) return;
  const result=(amount/rates[from])*rates[to];
  document.getElementById('result-val').textContent=result.toLocaleString('en-US',{maximumFractionDigits:4});
  document.getElementById('rate-info').textContent=`1 ${from} = ${(rates[to]/rates[from]).toFixed(6)} ${to}`;
}

function showPopular() {
  document.getElementById('popular-rates').innerHTML=POPULAR.map(c=>`
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;">
      <div style="font-size:0.7rem;color:var(--text3);font-family:var(--font-mono);">1 USD</div>
      <div style="font-size:1rem;font-weight:500;color:var(--gold);margin:2px 0;">${rates[c]?.toFixed(4)||'—'}</div>
      <div style="font-size:0.75rem;color:var(--text2);">${c}</div>
    </div>`).join('');
}

populateSelects();
fetchRates();
document.getElementById('btn-convert').addEventListener('click',convert);
document.getElementById('btn-swap').addEventListener('click',()=>{
  const f=document.getElementById('from-cur').value,t=document.getElementById('to-cur').value;
  document.getElementById('from-cur').value=t;
  document.getElementById('to-cur').value=f;
  convert();
});
document.getElementById('amount').addEventListener('input',convert);
</script>
<script src="../assets/js/nav.js"></script>
</body>
</html>
