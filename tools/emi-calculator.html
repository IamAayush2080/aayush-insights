<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMI Calculator — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🏦</div>
    <h1 class="tool-page-title">EMI / Loan Calculator</h1>
    <p class="tool-page-desc">Calculate monthly EMI, total interest and total payment for any loan.</p>
  </div>
  <div class="tool-page-body">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;margin-bottom:20px;">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:20px;">
        <div>
          <label style="font-size:0.78rem;color:var(--text3);font-family:var(--font-mono);display:block;margin-bottom:6px;">LOAN AMOUNT</label>
          <input type="number" id="principal" class="tool-input" style="width:100%;" value="100000" placeholder="Loan amount" />
        </div>
        <div>
          <label style="font-size:0.78rem;color:var(--text3);font-family:var(--font-mono);display:block;margin-bottom:6px;">ANNUAL INTEREST RATE (%)</label>
          <input type="number" id="rate" class="tool-input" style="width:100%;" value="10" step="0.1" placeholder="Interest rate %" />
        </div>
        <div>
          <label style="font-size:0.78rem;color:var(--text3);font-family:var(--font-mono);display:block;margin-bottom:6px;">LOAN TENURE</label>
          <div style="display:flex;gap:8px;">
            <input type="number" id="tenure" class="tool-input" style="flex:1;" value="12" placeholder="Duration" />
            <select class="tool-select" id="tenure-type">
              <option value="months">Months</option>
              <option value="years">Years</option>
            </select>
          </div>
        </div>
      </div>
      <button class="btn-primary" id="btn-calc" style="padding:10px 28px;">Calculate EMI →</button>
    </div>

    <div id="result" style="display:none;">
      <div class="stat-row">
        <div class="stat-box"><div class="stat-box-num" id="r-emi">0</div><div class="stat-box-label">Monthly EMI</div></div>
        <div class="stat-box"><div class="stat-box-num" id="r-interest">0</div><div class="stat-box-label">Total Interest</div></div>
        <div class="stat-box"><div class="stat-box-num" id="r-total">0</div><div class="stat-box-label">Total Payment</div></div>
      </div>
      <div class="tool-section-card" style="margin-top:16px;">
        <div class="tsc-header"><span class="mono" style="font-size:0.72rem;letter-spacing:0.15em;color:var(--text3);">BREAKDOWN</span></div>
        <div id="breakdown" style="font-size:0.9rem;color:var(--text2);line-height:2.2;"></div>
      </div>
    </div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>
document.getElementById('btn-calc').addEventListener('click', () => {
  const P = parseFloat(document.getElementById('principal').value);
  const r = parseFloat(document.getElementById('rate').value) / 100 / 12;
  let n = parseInt(document.getElementById('tenure').value);
  if (document.getElementById('tenure-type').value === 'years') n *= 12;
  if (!P || !r || !n) return;

  const emi = (P * r * Math.pow(1+r,n)) / (Math.pow(1+r,n)-1);
  const total = emi * n;
  const interest = total - P;

  const fmt = v => '₹' + v.toLocaleString('en-IN', {maximumFractionDigits:0});
  document.getElementById('r-emi').textContent = fmt(emi);
  document.getElementById('r-interest').textContent = fmt(interest);
  document.getElementById('r-total').textContent = fmt(total);

  const pct = ((interest/total)*100).toFixed(1);
  document.getElementById('breakdown').innerHTML = `
    <div>💰 Principal amount: <strong style="color:var(--gold)">${fmt(P)}</strong></div>
    <div>📈 Total interest: <strong style="color:var(--gold)">${fmt(interest)}</strong> (${pct}% of total)</div>
    <div>📅 Number of EMIs: <strong style="color:var(--gold)">${n}</strong></div>
    <div>💳 Total payment: <strong style="color:var(--gold)">${fmt(total)}</strong></div>
  `;
  document.getElementById('result').style.display = 'block';
});
</script>
</body>
</html>
