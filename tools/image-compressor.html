<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Compressor — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">🗜️</div>
    <h1 class="tool-page-title">Image Compressor</h1>
    <p class="tool-page-desc">Compress images and reduce file size without losing visible quality. 100% in-browser.</p>
  </div>
  <div class="tool-page-body">
    <div id="drop-zone" style="border:2px dashed var(--border2);border-radius:var(--r-lg);padding:48px;text-align:center;cursor:pointer;transition:var(--transition);margin-bottom:20px;">
      <div style="font-size:2.5rem;margin-bottom:12px;">🗜️</div>
      <p style="color:var(--text2);margin-bottom:8px;">Drop image here or click to upload</p>
      <p style="font-size:0.78rem;color:var(--text3);">PNG, JPG, WebP supported</p>
      <input type="file" id="file-input" accept="image/*" style="display:none;" />
    </div>

    <div id="controls" style="display:none;">
      <div style="margin-bottom:20px;">
        <label style="font-size:0.85rem;color:var(--text2);display:block;margin-bottom:10px;">Quality: <strong id="quality-val" style="color:var(--gold);">80%</strong></label>
        <input type="range" id="quality" min="10" max="100" value="80" />
      </div>
      <div style="margin-bottom:16px;">
        <select class="tool-select" id="out-format">
          <option value="image/jpeg">JPEG (best compression)</option>
          <option value="image/png">PNG (lossless)</option>
          <option value="image/webp">WebP (modern)</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-compress" style="padding:10px 28px;">Compress & Download →</button>
        <button class="toolbar-btn" id="btn-reset">Reset</button>
      </div>
      <div id="result-info" style="margin-top:16px;"></div>

      <!-- Preview -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;" id="preview-wrap">
        <div style="text-align:center;">
          <p style="font-size:0.72rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.15em;margin-bottom:8px;">ORIGINAL</p>
          <img id="orig-preview" style="max-width:100%;border-radius:var(--r-md);border:1px solid var(--border);" />
          <p id="orig-size" style="font-size:0.78rem;color:var(--text3);margin-top:6px;"></p>
        </div>
        <div style="text-align:center;">
          <p style="font-size:0.72rem;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.15em;margin-bottom:8px;">COMPRESSED</p>
          <img id="comp-preview" style="max-width:100%;border-radius:var(--r-md);border:1px solid var(--border);" />
          <p id="comp-size" style="font-size:0.78rem;color:var(--text3);margin-top:6px;"></p>
        </div>
      </div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/theme.js"></script>
<script>
let origFile, img = new Image();
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const controls = document.getElementById('controls');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='var(--gold)'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor='var(--border2)');
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor='var(--border2)'; loadFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));

document.getElementById('quality').addEventListener('input', function() {
  document.getElementById('quality-val').textContent = this.value + '%';
});

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  origFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    img.onload = () => {
      document.getElementById('orig-preview').src = e.target.result;
      document.getElementById('orig-size').textContent = `${img.width}×${img.height} · ${(file.size/1024).toFixed(1)} KB`;
      controls.style.display = 'block';
      dropZone.style.display = 'none';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById('btn-compress').addEventListener('click', () => {
  const canvas = document.getElementById('canvas');
  canvas.width = img.width; canvas.height = img.height;
  canvas.getContext('2d').drawImage(img, 0, 0);
  const fmt = document.getElementById('out-format').value;
  const q   = parseInt(document.getElementById('quality').value) / 100;
  const dataURL = canvas.toDataURL(fmt, q);

  // Estimate size
  const base64 = dataURL.split(',')[1];
  const bytes = Math.round((base64.length * 3) / 4);
  const saved = (((origFile.size - bytes) / origFile.size) * 100).toFixed(1);

  document.getElementById('comp-preview').src = dataURL;
  document.getElementById('comp-size').textContent = `${(bytes/1024).toFixed(1)} KB`;
  document.getElementById('result-info').innerHTML = `<span class="result-badge success">✓ Reduced by ~${saved}% — ${(origFile.size/1024).toFixed(1)} KB → ~${(bytes/1024).toFixed(1)} KB</span>`;

  const ext = fmt.split('/')[1];
  const a = document.createElement('a');
  a.download = `compressed.${ext}`;
  a.href = dataURL;
  a.click();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  controls.style.display='none'; dropZone.style.display='block'; fileInput.value='';
  document.getElementById('result-info').innerHTML='';
});
</script>
<script src="../assets/js/nav.js"></script>
</body>
</html>
