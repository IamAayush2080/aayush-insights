<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Humanizer — Aayush Insights</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="tools.css" /><link rel="stylesheet" href="tool-page.css" />
</head>
<body>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text">Aayush Insights</span><span class="nav-logo-num">#7539</span></a>
  <ul class="nav-links"><li><a href="index.html" class="active">Tools</a></li></ul>
  <a href="index.html" class="nav-cta">← All Tools</a>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="tool-back">← Back to Tools</a>
    <div class="tool-page-icon">✨</div>
    <h1 class="tool-page-title">AI Humanizer</h1>
    <p class="tool-page-desc">Rewrite AI-generated text to sound more natural, personal and human.</p>
  </div>
  <div class="tool-page-body">

    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center;">
      <span style="font-size:0.85rem;color:var(--text2);">Tone:</span>
      <select class="tool-select" id="tone-select">
        <option value="casual">Casual & Natural</option>
        <option value="formal">Formal but Human</option>
        <option value="simple">Simple & Clear</option>
        <option value="conversational">Conversational</option>
        <option value="student">Student Writing</option>
      </select>
      <span style="font-size:0.85rem;color:var(--text2);">Strength:</span>
      <select class="tool-select" id="strength-select">
        <option value="light">Light rewrite</option>
        <option value="medium" selected>Medium rewrite</option>
        <option value="heavy">Heavy rewrite</option>
      </select>
    </div>

    <div class="tool-two-col">
      <div class="tool-input-wrap">
        <div class="tool-input-toolbar">
          <span class="toolbar-label mono">AI Text Input</span>
          <button class="toolbar-btn" id="btn-paste">Paste</button>
          <button class="toolbar-btn" id="btn-clear">Clear</button>
        </div>
        <textarea id="main-input" class="tool-textarea" placeholder="Paste AI-generated text here..."></textarea>
      </div>
      <div class="tool-input-wrap">
        <div class="tool-input-toolbar">
          <span class="toolbar-label mono">Humanized Output</span>
          <button class="toolbar-btn" id="btn-copy">Copy</button>
        </div>
        <div id="output" class="tool-output" style="min-height:200px;">Your humanized text will appear here...</div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="btn-humanize" style="padding:10px 28px;">✨ Humanize Text →</button>
    </div>
    <div id="status" style="margin-top:12px;"></div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>
document.getElementById('btn-paste').addEventListener('click', async () => { document.getElementById('main-input').value = await navigator.clipboard.readText(); });
document.getElementById('btn-clear').addEventListener('click', () => { document.getElementById('main-input').value=''; document.getElementById('output').textContent='Your humanized text will appear here...'; });
document.getElementById('btn-copy').addEventListener('click', () => navigator.clipboard.writeText(document.getElementById('output').textContent));

document.getElementById('btn-humanize').addEventListener('click', async () => {
  const text = document.getElementById('main-input').value.trim();
  if (!text) return;
  const tone = document.getElementById('tone-select').value;
  const strength = document.getElementById('strength-select').value;
  const st = document.getElementById('status');
  const out = document.getElementById('output');

  st.innerHTML = '<span class="result-badge info">⏳ Humanizing...</span>';
  out.textContent = '';

  const toneMap = {
    casual: 'casual, relaxed, natural everyday language',
    formal: 'formal but warm and human, not robotic',
    simple: 'simple, clear, easy to understand language',
    conversational: 'conversational, like talking to a friend',
    student: 'like a student writing — natural, slightly imperfect, genuine'
  };
  const strengthMap = {
    light: 'Make minor adjustments to reduce AI patterns while keeping most of the original structure.',
    medium: 'Significantly rewrite the text to sound human while preserving the core meaning.',
    heavy: 'Completely rewrite in a natural human voice, changing structure and phrasing throughout.'
  };

  const prompt = `You are an expert at rewriting AI-generated text to sound natural and human.

Rewrite the following text using ${toneMap[tone]}.
${strengthMap[strength]}

Rules:
- Remove all AI transition phrases like "furthermore", "moreover", "it is important to note"
- Vary sentence lengths naturally — mix short punchy sentences with longer ones
- Add occasional informal touches, contractions, personal voice
- Remove passive voice where possible
- Keep the same meaning and information
- Do NOT add any preamble, explanation or commentary — output ONLY the rewritten text

Text to humanize:
${text}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const result = data.content?.[0]?.text || 'Error getting response.';
    out.textContent = result;
    st.innerHTML = '<span class="result-badge success">✓ Text humanized successfully</span>';
  } catch(e) {
    // Fallback: basic local humanization
    let result = text;
    const replacements = [
      [/furthermore,?\s*/gi, ''],
      [/moreover,?\s*/gi, 'also, '],
      [/additionally,?\s*/gi, 'plus, '],
      [/it is important to note that\s*/gi, 'notably, '],
      [/it is worth noting that\s*/gi, ''],
      [/in conclusion,?\s*/gi, 'so, '],
      [/to summarize,?\s*/gi, 'in short, '],
      [/as a result,?\s*/gi, 'so '],
      [/consequently,?\s*/gi, 'so '],
      [/nevertheless,?\s*/gi, 'still, '],
      [/this demonstrates that\s*/gi, 'this shows '],
      [/this highlights\s*/gi, 'this shows '],
      [/can be seen\s*/gi, 'is '],
      [/it should be noted\s*/gi, ''],
      [/in other words,?\s*/gi, 'basically, '],
    ];
    replacements.forEach(([from, to]) => { result = result.replace(from, to); });
    out.textContent = result;
    st.innerHTML = '<span class="result-badge info">✓ Basic humanization applied (API unavailable)</span>';
  }
});
</script>
</body>
</html>
