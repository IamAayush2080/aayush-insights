    }
    .search-bar-input {
      flex:1; background:none; border:none; outline:none;

    }
    .search-bar-input::placeholder { color:var(--text3); }

    .sf-btn {

    .result-item {

      padding:14px 16px; background:var(--bg2);
      border:1px solid var(--border); border-radius:var(--r-md);
      margin-bottom:8px; text-decoration:none;

    .result-icon {

    }
    .result-count { font-size:0.82rem; color:var(--text3); margin-bottom:20px; }
    mark { background:var(--gold-dim); color:var(--gold-lt); border-radius:2px; padding:0 2px; }
    .empty-state { text-align:center; padding:60px 0; color:var(--text3); }

const POPULAR = ['Password Generator','QR Code Generator','JSON Formatter','Word Counter','Currency Converter','Age Calculator','Resume Builder','BMI Calculator'];

let currentType = 'all';
let currentQuery = '';

// ── Highlight matches ─────────────────────────────────────────
function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

// ── Render results ────────────────────────────────────────────
function renderResults() {
  const wrap    = document.getElementById('search-results');
  const defState = document.getElementById('default-state');
  const q = currentQuery.toLowerCase().trim();

  if (!q) {
    wrap.style.display = 'none';
    defState.style.display = 'block';
    return;
  }

  wrap.style.display = 'block';
  defState.style.display = 'none';

  const filtered = SITE_INDEX.filter(item => {
    const typeMatch = currentType === 'all' || item.type === currentType;
    const textMatch = item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.cat.toLowerCase().includes(q);
    return typeMatch && textMatch;
  });

  if (!filtered.length) {
    wrap.innerHTML = `<div class="empty-state">
      <div style="font-size:2.5rem;margin-bottom:12px;">🔍</div>
      <p style="font-size:1rem;color:var(--text2);">No results for "<strong>${q}</strong>"</p>
      <p style="font-size:0.85rem;margin-top:8px;">Try a different keyword</p>
    </div>`;
    return;
  }

  // Group by type
  const groups = { tools:'⚙️ Tools', articles:'📖 Articles', thoughts:'💭 Thoughts', pages:'📄 Pages' };
  let html = `<p class="result-count">${filtered.length} result${filtered.length!==1?'s':''} for "<strong>${q}</strong>"</p>`;

  Object.keys(groups).forEach(type => {
    const items = filtered.filter(i => i.type === type);
    if (!items.length) return;
    html += `<div class="result-section">
      <div class="result-section-title">${groups[type]} (${items.length})</div>
      ${items.map(item => `
        <a href="${item.url}" class="result-item">
          <div class="result-icon">${item.icon}</div>
          <div style="flex:1;min-width:0;">
            <div class="result-name">${highlight(item.name, q)}</div>
            <div class="result-desc">${highlight(item.desc, q)}</div>
          </div>
          <span class="result-cat">${item.cat}</span>
        </a>`).join('')}
    </div>`;
  });

  wrap.innerHTML = html;
}

// ── Popular tools default state ───────────────────────────────
function renderPopular() {
  const popular = SITE_INDEX.filter(i => POPULAR.includes(i.name));
  document.getElementById('popular-tools').innerHTML = popular.map(item => `
    <a href="${item.url}" class="result-item">
      <div class="result-icon">${item.icon}</div>
      <div style="flex:1;min-width:0;">
        <div class="result-name">${item.name}</div>
        <div class="result-desc">${item.desc}</div>
      </div>
      <span class="result-cat">${item.cat}</span>
    </a>`).join('');
}

// ── Event listeners ───────────────────────────────────────────
const searchInput = document.getElementById('main-search');
const clearBtn    = document.getElementById('btn-clear-search');

searchInput.addEventListener('input', e => {
  currentQuery = e.target.value;
  clearBtn.style.display = currentQuery ? 'block' : 'none';
  renderResults();
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  currentQuery = '';
  clearBtn.style.display = 'none';
  renderResults();
  searchInput.focus();
});

document.querySelectorAll('.sf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sf-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    renderResults();
  });
});

// ── Handle URL query param ?q=search ─────────────────────────
const urlQ = new URLSearchParams(window.location.search).get('q');
if (urlQ) { searchInput.value = urlQ; currentQuery = urlQ; clearBtn.style.display='block'; renderResults(); }

renderPopular();
</script>
